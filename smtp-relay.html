<!doctype html>
<html lang="en" data-theme="dark" data-mpr-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pinguin SMTP Relay</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.css"
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/smtp-relay.css" />
    <script defer src="/js/google-analytics.js"></script>
    <script defer src="/js/runtime-config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui-config.js"></script>
    <script
      id="mpr-ui-bundle"
      type="application/json"
      data-mpr-ui-bundle-src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.js"
    ></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="https://loopaware.mprlab.com/pixel.js?site_id=f42bd5af-db6b-41e1-811e-5c04332ecdee"></script>
  </head>
  <body data-page="smtp-relay" class="theme-dark" data-theme="dark" x-data="appShell()">
    <mpr-header
      id="pinguin-smtp-relay-header"
      data-config-url="/config-ui.yaml"
      brand-label="Pinguin"
      brand-href="/"
      nav-links='[{ "label": "Docs", "href": "https://github.com/tyemirov/pinguin" }]'
    >
      <a slot="brand" class="pinguin-brand" href="/" aria-label="Pinguin home">
        <img class="pinguin-brand__mark" src="/favicon.svg" alt="" aria-hidden="true" />
        <span>Pinguin</span>
      </a>
      <span slot="nav-left" class="workspace-navigation__menu">
		<a
		  class="workspace-navigation__link"
		  :href="RUNTIME_CONFIG.tenantUrl"
		  x-text="STRINGS.navigation.tenants"
		></a>
        <a
          class="workspace-navigation__link"
          :href="RUNTIME_CONFIG.eventLogUrl"
          x-text="STRINGS.navigation.eventLog"
        ></a>
        <a
          class="workspace-navigation__link"
          :href="RUNTIME_CONFIG.smtpRelayUrl"
          aria-current="page"
          x-text="STRINGS.navigation.smtpRelay"
        ></a>
      </span>
    </mpr-header>
    <main class="page-main">
      <section
        id="smtp-relay"
        class="page-work-surface page-work-surface--expanded panel smtp-workspace"
        aria-labelledby="smtp-relay-title"
        x-data="smtpWorkspace()"
        data-testid="page-work-surface"
        data-page-surface="smtp-workspace"
      >
        <header class="panel-header">
          <div>
            <h1 id="smtp-relay-title" class="section-title" x-text="strings.title"></h1>
            <p class="text-muted" x-text="strings.subtitle"></p>
          </div>
        </header>
		<label class="smtp-tenant-selector">
		  <span x-text="strings.tenantLabel"></span>
		  <select x-model="selectedTenantId" x-on:change="changeTenant()" :disabled="tenants.length === 0">
			<template x-for="tenant in tenants" :key="tenant.id">
			  <option :value="tenant.id" x-text="tenant.displayName"></option>
			</template>
		  </select>
		</label>
        <template x-if="errorMessage">
          <p class="notice" data-variant="error" x-text="errorMessage"></p>
        </template>
        <section class="workspace-section" aria-labelledby="smtp-domain-setup-title">
          <header class="workspace-section__header">
            <div>
              <h2 id="smtp-domain-setup-title" x-text="strings.domainSetupTitle"></h2>
              <p x-text="strings.domainSetupDescription"></p>
            </div>
            <form class="domain-form" x-on:submit.prevent="createDomain">
              <label>
                <span x-text="strings.domainLabel"></span>
                <input
                  type="text"
                  x-model="domainName"
                  :placeholder="strings.domainPlaceholder"
                  autocomplete="off"
                  required
                />
              </label>
              <button
                class="button primary"
                type="submit"
                :disabled="isSubmitting"
                x-text="strings.domainAddLabel"
              ></button>
            </form>
          </header>
          <template x-if="isLoadingDomains">
            <p class="empty-state" x-text="strings.domainLoadingState"></p>
          </template>
          <template x-if="!isLoadingDomains && domains.length === 0">
            <p class="empty-state" x-text="strings.domainEmptyState"></p>
          </template>
          <div class="domain-list">
            <template x-for="domain in domains" :key="domain.id">
              <article class="domain-item" data-testid="smtp-domain-card">
                <header class="domain-item__summary">
                  <div class="domain-item__identity">
                    <strong x-text="domain.domain"></strong>
                    <span
                      class="status-badge"
                      :data-variant="domain.status === 'verified' ? 'verified' : 'pending'"
                      x-text="domainStatusLabel(domain)"
                    ></span>
                  </div>
                  <span class="domain-item__checked" x-text="domainLastCheckedLabel(domain)"></span>
                  <button
                    class="button"
                    type="button"
                    :disabled="checkingDomainId === domain.id"
                    x-on:click="checkDomain(domain)"
                    x-text="strings.domainCheckLabel"
                  ></button>
                  <button
                    class="button"
                    type="button"
                    :aria-expanded="String(expandedDomainId === domain.id)"
                    :aria-label="domainToggleLabel(domain)"
                    x-on:click="toggleDomain(domain)"
                    x-text="expandedDomainId === domain.id ? strings.domainCollapseLabel : strings.domainExpandLabel"
                  ></button>
                </header>
                <section
                  class="domain-item__details"
                  data-testid="smtp-domain-details"
                  x-cloak
                  x-show="expandedDomainId === domain.id"
                >
                  <template x-for="record in domain.dnsRecords" :key="record.host + record.value">
                    <article class="dns-record-row" data-testid="dns-record-row">
                      <header class="dns-record-row__header">
                        <span class="dns-record-row__purpose" x-text="record.purpose"></span>
                        <span
                          class="status-badge"
                          :data-variant="domainRecordState(domain, record)"
                          x-text="domainRecordStatusLabel(domain, record)"
                        ></span>
                      </header>
                      <div class="dns-value">
                        <span class="metadata-label" x-text="strings.domainHostColumn"></span>
                        <span class="dns-value__content">
                          <code x-text="record.host"></code>
                          <button
                            class="copy-field__button"
                            type="button"
                            :aria-label="strings.domainCopyHostLabel"
                            :title="strings.domainCopyHostLabel"
                            x-on:click="copyDNSValue(record.host, strings.domainCopyHostSuccess)"
                          >
                            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                              <path d="M8 7h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
                              <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                            </svg>
                          </button>
                        </span>
                      </div>
                      <div class="dns-value">
                        <span class="metadata-label" x-text="strings.domainValueColumn"></span>
                        <span class="dns-value__content">
                          <code x-text="record.value"></code>
                          <button
                            class="copy-field__button"
                            type="button"
                            :aria-label="strings.domainCopyValueLabel"
                            :title="strings.domainCopyValueLabel"
                            x-on:click="copyDNSValue(record.value, strings.domainCopyValueSuccess)"
                          >
                            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                              <path d="M8 7h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
                              <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                            </svg>
                          </button>
                        </span>
                      </div>
                      <p class="dns-record-row__result" x-text="domainRecordMessage(domain, record)"></p>
                    </article>
                  </template>
                </section>
              </article>
            </template>
          </div>
        </section>
        <section class="workspace-section" aria-labelledby="smtp-identities-title">
          <header class="workspace-section__header">
            <div>
              <h2 id="smtp-identities-title" x-text="strings.identitiesTitle"></h2>
              <p x-text="strings.identitiesDescription"></p>
            </div>
            <button
              class="button primary"
              type="button"
              :disabled="verifiedDomains().length === 0"
              x-on:click="openIdentityDialog($event)"
              x-text="strings.createIdentityLabel"
            ></button>
          </header>
          <template x-if="isLoading">
            <p class="empty-state" x-text="strings.loadingState"></p>
          </template>
          <template x-if="!isLoading && identities.length === 0">
            <p class="empty-state" x-text="strings.emptyState"></p>
          </template>
          <div
            class="identity-list"
            role="list"
            tabindex="-1"
            x-ref="identityList"
            :aria-label="strings.identitiesTitle"
          >
            <template x-for="identity in identities" :key="identity.id">
              <article class="identity-row" role="listitem" data-testid="smtp-identity-row">
                <div class="identity-row__summary">
                  <button
                    class="identity-record-button"
                    type="button"
                    :aria-label="credentialsRecordLabel(identity)"
                    :disabled="isSubmitting"
                    x-on:click="viewCredentials($event, identity)"
                  >
                    <span x-text="identity.emailAddress"></span>
                  </button>
                  <dl class="identity-row__metadata">
                    <div class="identity-row__metadata-item">
                      <dt class="metadata-label" x-text="strings.usernameLabel"></dt>
                      <dd class="identity-row__value" x-text="identity.username"></dd>
                    </div>
                    <div class="identity-row__metadata-item">
                      <dt class="metadata-label" x-text="strings.forwardToDisplayLabel"></dt>
                      <dd class="identity-row__value" x-text="identity.forwardTo.join(', ')"></dd>
                    </div>
                    <div class="identity-row__metadata-item">
                      <dt class="metadata-label" x-text="strings.lastUsedLabel"></dt>
                      <dd class="identity-row__value" x-text="formatTimestamp(identity.lastUsedAt)"></dd>
                    </div>
                  </dl>
                  <div class="identity-row__actions">
                    <button
                      class="button"
                      type="button"
                      x-on:click="editForwarding($event, identity)"
                      :disabled="isSubmitting"
                      x-text="strings.editForwardingLabel"
                    ></button>
                    <button
                      class="button danger"
                      type="button"
                      x-on:click="openDeleteDialog($event, identity)"
                      :disabled="isSubmitting"
                      x-text="actions.delete"
                    ></button>
                  </div>
                </div>
                <form
                  class="identity-edit-form"
                  x-cloak
                  x-show="editingIdentityId === identity.id"
                  x-on:submit.prevent="updateForwarding"
                >
                  <label>
                    <span x-text="strings.forwardToLabel"></span>
                    <textarea x-model="editingForwardToText" :placeholder="strings.forwardToPlaceholder" rows="2" required></textarea>
                  </label>
                  <button class="button primary" type="submit" x-text="actions.saveChanges"></button>
                  <button class="button" type="button" x-on:click="cancelForwardingEdit()" x-text="strings.cancelEditLabel"></button>
                </form>
              </article>
            </template>
          </div>
        </section>
        <dialog
          class="dialog"
          x-ref="identityDialog"
          aria-labelledby="identity-dialog-title"
          x-on:close="handleIdentityDialogClosed()"
        >
          <form class="dialog__body identity-create-form" x-on:submit.prevent="createIdentity">
            <header class="dialog__header identity-create-form__full">
              <h2 id="identity-dialog-title" x-text="strings.createIdentityTitle"></h2>
              <p x-text="strings.createIdentityDescription"></p>
            </header>
            <label>
              <span x-text="strings.localPartLabel"></span>
              <input type="text" x-model="identityLocalPart" :placeholder="strings.localPartPlaceholder" autocomplete="off" required />
            </label>
            <label>
              <span x-text="strings.senderDomainLabel"></span>
              <select x-model="selectedIdentityDomain" required>
                <option value="" x-text="strings.senderDomainPlaceholder"></option>
                <template x-for="domain in verifiedDomains()" :key="domain.id">
                  <option :value="domain.domain" x-text="domain.domain"></option>
                </template>
              </select>
            </label>
            <label class="identity-create-form__full">
              <span x-text="strings.forwardToLabel"></span>
              <textarea x-model="identityForwardToText" :placeholder="strings.forwardToPlaceholder" rows="3" required></textarea>
            </label>
            <footer class="dialog__actions identity-create-form__full">
              <button class="button" type="button" x-on:click="closeIdentityDialog()" x-text="actions.close"></button>
              <button class="button primary" type="submit" :disabled="isSubmitting" x-text="strings.createIdentityLabel"></button>
            </footer>
          </form>
        </dialog>
        <dialog
          class="dialog dialog--wide"
          x-ref="credentialsDialog"
          aria-labelledby="credentials-dialog-title"
          x-on:close="handleCredentialsDialogClosed()"
        >
          <form class="dialog__body" method="dialog">
            <header class="dialog__header">
              <h2 id="credentials-dialog-title" x-text="strings.credentialsTitle"></h2>
              <button
                class="dialog__close"
                type="button"
                :aria-label="strings.credentialsCloseLabel"
                :title="strings.credentialsCloseLabel"
                x-on:click="closeCredentialsDialog()"
              >
                <span aria-hidden="true">×</span>
              </button>
              <p x-text="strings.credentialsDescription"></p>
            </header>
            <template x-if="credentials">
              <div class="credentials-grid" data-testid="smtp-credentials">
                <p
                  class="notice credential-notice credentials-grid__full"
                  role="status"
                  aria-live="polite"
                  data-testid="smtp-credential-notice"
                  :data-variant="credentialNotice ? credentialNotice.variant : 'info'"
                  x-cloak
                  x-show="credentialNotice"
                  x-text="credentialNotice ? credentialNotice.message : ''"
                ></p>
                <label>
                  <span x-text="strings.hostLabel"></span>
                  <span class="copy-field">
                    <input type="text" readonly aria-readonly="true" :value="credentials.smtpSettings.host" />
                    <button
                      class="copy-field__button"
                      type="button"
                      :aria-label="strings.hostCopyLabel"
                      :title="strings.hostCopyLabel"
                      x-on:click="copyCredentialValue(credentials.smtpSettings.host, strings.hostCopySuccess)"
                    >
                      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M8 7h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
                        <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                      </svg>
                    </button>
                  </span>
                </label>
                <label>
                  <span x-text="strings.portLabel"></span>
                  <input type="text" readonly aria-readonly="true" :value="credentials.smtpSettings.port" />
                </label>
                <label>
                  <span x-text="strings.securityLabel"></span>
                  <input type="text" readonly aria-readonly="true" :value="credentials.smtpSettings.securityMode" />
                </label>
                <label>
                  <span x-text="strings.usernameLabel"></span>
                  <span class="copy-field">
                    <input type="text" readonly aria-readonly="true" :value="credentials.username" />
                    <button
                      class="copy-field__button"
                      type="button"
                      :aria-label="strings.usernameCopyLabel"
                      :title="strings.usernameCopyLabel"
                      x-on:click="copyCredentialValue(credentials.username, strings.usernameCopySuccess)"
                    >
                      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M8 7h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
                        <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                      </svg>
                    </button>
                  </span>
                </label>
                <div class="credentials-field credentials-grid__full">
                  <span class="field-label" x-text="strings.passwordLabel"></span>
                  <span class="copy-field">
                    <span class="credential-plain-text" data-testid="smtp-password-value" x-text="credentials.password"></span>
                    <button
                      class="copy-field__button"
                      type="button"
                      :aria-label="strings.passwordCopyLabel"
                      :title="strings.passwordCopyLabel"
                      x-on:click="copyCredentialValue(credentials.password, strings.passwordCopySuccess)"
                    >
                      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                        <path d="M8 7h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"></path>
                        <path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                      </svg>
                    </button>
                  </span>
                </div>
                <footer class="dialog__actions credentials-grid__full">
                  <button
                    class="button"
                    type="button"
                    :disabled="isSubmitting"
                    x-on:click="rotateCurrentCredentials()"
                    x-text="strings.rotateCredentialsLabel"
                  ></button>
                </footer>
              </div>
            </template>
          </form>
        </dialog>
        <dialog
          class="dialog"
          x-ref="deleteDialog"
          aria-labelledby="delete-dialog-title"
          x-on:close="handleDeleteDialogClosed()"
        >
          <form class="dialog__body" x-on:submit.prevent="confirmDeleteIdentity">
            <header class="dialog__header">
              <h2 id="delete-dialog-title" x-text="strings.deleteDialogTitle"></h2>
              <p x-text="strings.deleteDialogDescription"></p>
            </header>
            <footer class="dialog__actions">
              <button class="button" type="button" x-on:click="closeDeleteDialog()" x-text="strings.deleteKeepLabel"></button>
              <button
                class="button danger"
                type="submit"
                :disabled="isSubmitting"
                x-text="strings.deleteActionLabel"
              ></button>
            </footer>
          </form>
        </dialog>
      </section>
    </main>
    <div class="toast-center" x-data="toastCenter()" x-init="init()" aria-live="polite">
      <template x-for="toast in toasts" :key="toast.id">
        <button
          type="button"
          class="toast"
          :data-variant="toast.variant"
          x-on:click="dismissToast(toast.id)"
          x-text="toast.message"
        ></button>
      </template>
    </div>
    <script type="module" src="/js/bootstrap.js"></script>
    <mpr-footer
      id="pinguin-smtp-relay-footer"
      prefix-text="Pinguin Notification Service"
      privacy-link-label="Privacy &amp; Terms"
      privacy-modal-content="
        <h1>Privacy Policy — Pinguin</h1>
        <p>Pinguin stores the notification drafts you create, recipient details, and delivery metadata solely to run the scheduling workspace.</p>
        <p>Authentication happens through the shared sign-in shell; Pinguin receives HttpOnly session cookies and never stores your password.</p>
        <p>We do not sell or share notification content with third parties, and you may remove queued items from the workspace at any time.</p>
      "
      links-collection='{"style":"drop-up","text":"Built By Marco Polo Research Lab","links":[{"label":"LLM Proxy","url":"https://llm-proxy.mprlab.com/"},{"label":"TAuth","url":"https://tauth.mprlab.com/"},{"label":"Ledger","url":"https://github.com/tyemirov/ledger"},{"label":"ISSUES.md","url":"https://issues.mprlab.com/"},{"label":"Dictator","url":"https://github.com/tyemirov/dictator"},{"label":"Pinguin","url":"https://pinguin.mprlab.com/"},{"label":"LoopAware","url":"https://loopaware.mprlab.com/"}]}'
      theme-switcher="toggle"
      theme-config='{"attribute":"data-theme","targets":["body"],"modes":[{"value":"light","attributeValue":"light","classList":["theme-light"]},{"value":"dark","attributeValue":"dark","classList":["theme-dark"]}]}'
    ></mpr-footer>
  </body>
</html>
