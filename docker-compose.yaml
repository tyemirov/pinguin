x-pingwin-service: &pingwin-service
  restart: unless-stopped
  ports:
    - "8081:8081"
    - "8025:25"
    - "1587:587"
    - "8465:465"
  env_file:
    - ./configs/.env.pingwin
  pull_policy: always
  healthcheck:
    test: ["CMD-SHELL", "wget -O- http://127.0.0.1:8081/healthz"]
    start_interval: 1s
    interval: 30s
    timeout: 2s
    retries: 6
    start_period: 30s
  volumes:
    - pinguin-data:/app/data
    - pingwin-web:/web:ro
    - ./configs/config.pingwin.yml:/config/config.yml:ro

services:
  ghttp:
    profiles:
      - dev
      - docker
    image: ghcr.io/tyemirov/ghttp:latest
    container_name: ghttp
    restart: unless-stopped
    pull_policy: always
    volumes:
      - pingwin-web:/web:ro
    command: ["--directory", "/web", "--response-header", "/healthz=Cache-Control:no-store", "8080"]
    ports:
      - "8080:8080"

  tauth:
    image: ghcr.io/tyemirov/tauth:latest
    container_name: tauth
    restart: unless-stopped
    pull_policy: always
    profiles:
      - dev
      - docker
    ports:
      - "8082:8082"
    env_file:
      - ./configs/.env.tauth
    volumes:
      - tauth-data:/data
      - ./configs/config.tauth.yml:/config/config.yml:ro

  pingwin-dev:
    <<: *pingwin-service
    profiles:
      - dev
    container_name: pingwin-dev
    depends_on:
      - tauth
    build:
      context: .
      dockerfile: Dockerfile

  pingwin:
    <<: *pingwin-service
    profiles:
      - docker
    container_name: pingwin
    depends_on:
      - tauth
    image: ghcr.io/tyemirov/pingwin:latest

volumes:
  pinguin-data:
  tauth-data:
  pingwin-web:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/web
