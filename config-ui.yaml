environments:
  - description: Production
    origins:
      - https://pinguin.mprlab.com
    auth:
      tauthUrl: https://tauth-api.mprlab.com
      tenantId: pinguin
      logoutPath: /auth/logout
      sessionPath: /auth/session
      providers:
        google:
          enabled: true
          clientId: 460317815414-f7ps2orvfcract2og605r2ghljbts4qv.apps.googleusercontent.com
          loginPath: /auth/google
          noncePath: /auth/nonce
        apple:
          enabled: false
        password:
          enabled: false
  - description: Local Docker
    origins:
      - http://localhost:8080
    auth:
      tauthUrl: http://localhost:8082
      tenantId: pinguin
      logoutPath: /auth/logout
      sessionPath: /auth/session
      providers:
        google:
          enabled: true
          clientId: 460317815414-f7ps2orvfcract2og605r2ghljbts4qv.apps.googleusercontent.com
          loginPath: /auth/google
          noncePath: /auth/nonce
        apple:
          enabled: false
        password:
          enabled: false
  - description: Playwright
    origins:
      - http://127.0.0.1:4174
    auth:
      tauthUrl: http://127.0.0.1:4174
      tenantId: tauth-devserver
      logoutPath: /auth/logout
      sessionPath: /auth/session
      providers:
        google:
          enabled: true
          clientId: playwright-client
          loginPath: /auth/google
          noncePath: /auth/nonce
        apple:
          enabled: false
        password:
          enabled: false
  - description: Playwright localhost
    origins:
      - http://localhost:4174
    auth:
      tauthUrl: http://localhost:4174
      tenantId: tauth-devserver
      logoutPath: /auth/logout
      sessionPath: /auth/session
      providers:
        google:
          enabled: true
          clientId: playwright-client
          loginPath: /auth/google
          noncePath: /auth/nonce
        apple:
          enabled: false
        password:
          enabled: false
