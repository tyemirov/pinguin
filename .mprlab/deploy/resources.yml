mprlab_resources:
    artifacts:
        binaries:
            - build:
                binary: pingwin
                package: ./cmd/server
                platforms:
                    - linux/amd64
                    - linux/arm64
                    - darwin/amd64
                    - darwin/arm64
                system: go
              id: server
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile
                platforms:
                    - linux/amd64
                    - linux/arm64
              id: pingwin-image
        web_bundles:
            - format: directory
              id: website
              source:
                kind: directory
                path: web
    environment:
        private_inputs:
            - id: connection-timeout-sec
              variable: CONNECTION_TIMEOUT_SEC
            - id: database-path
              variable: DATABASE_PATH
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: http-allowed-origin1
              variable: HTTP_ALLOWED_ORIGIN1
            - id: http-allowed-origin2
              variable: HTTP_ALLOWED_ORIGIN2
            - id: http-allowed-origin3
              variable: HTTP_ALLOWED_ORIGIN3
            - id: http-listen-addr
              variable: HTTP_LISTEN_ADDR
            - id: log-level
              variable: LOG_LEVEL
            - id: master-encryption-key
              variable: MASTER_ENCRYPTION_KEY
            - id: max-retries
              variable: MAX_RETRIES
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
            - id: operation-timeout-sec
              variable: OPERATION_TIMEOUT_SEC
            - id: retry-interval-sec
              variable: RETRY_INTERVAL_SEC
            - id: smtp-forwarding-enabled
              variable: SMTP_FORWARDING_ENABLED
            - id: smtp-forwarding-hostname
              variable: SMTP_FORWARDING_HOSTNAME
            - id: smtp-forwarding-listen-addr
              variable: SMTP_FORWARDING_LISTEN_ADDR
            - id: smtp-forwarding-max-message-bytes
              variable: SMTP_FORWARDING_MAX_MESSAGE_BYTES
            - id: smtp-forwarding-max-recipients
              variable: SMTP_FORWARDING_MAX_RECIPIENTS
            - id: smtp-forwarding-relay-host
              variable: SMTP_FORWARDING_RELAY_HOST
            - id: smtp-forwarding-relay-password
              variable: SMTP_FORWARDING_RELAY_PASSWORD
            - id: smtp-forwarding-relay-port
              variable: SMTP_FORWARDING_RELAY_PORT
            - id: smtp-forwarding-relay-username
              variable: SMTP_FORWARDING_RELAY_USERNAME
            - id: smtp-submission-allow-insecure-auth
              variable: SMTP_SUBMISSION_ALLOW_INSECURE_AUTH
            - id: smtp-submission-delivery-mode
              variable: SMTP_SUBMISSION_DELIVERY_MODE
            - id: smtp-submission-hostname
              variable: SMTP_SUBMISSION_HOSTNAME
            - id: smtp-submission-listen-addr
              variable: SMTP_SUBMISSION_LISTEN_ADDR
            - id: smtp-submission-max-message-bytes
              variable: SMTP_SUBMISSION_MAX_MESSAGE_BYTES
            - id: smtp-submission-max-recipients
              variable: SMTP_SUBMISSION_MAX_RECIPIENTS
            - id: smtp-submission-public-port
              variable: SMTP_SUBMISSION_PUBLIC_PORT
            - id: smtp-submission-public-security-mode
              variable: SMTP_SUBMISSION_PUBLIC_SECURITY_MODE
            - id: smtp-submission-relay-host
              variable: SMTP_SUBMISSION_RELAY_HOST
            - id: smtp-submission-relay-password
              variable: SMTP_SUBMISSION_RELAY_PASSWORD
            - id: smtp-submission-relay-port
              variable: SMTP_SUBMISSION_RELAY_PORT
            - id: smtp-submission-relay-username
              variable: SMTP_SUBMISSION_RELAY_USERNAME
            - id: tauth-cookie-name
              variable: TAUTH_COOKIE_NAME
            - id: tauth-signing-key
              variable: TAUTH_SIGNING_KEY
            - id: tauth-tenant-google-web-client-id-pingwin
              variable: TAUTH_TENANT_GOOGLE_WEB_CLIENT_ID_PINGWIN
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 30s
                request: 15s
                shutdown: 5s
                startup: 30s
        observations:
            http:
                - expected_status: 200
                  id: public-health
                  protocol: http
                  url: https://pingwin-api.mprlab.com/healthz
                - expected_status: 200
                  id: website-health
                  protocol: http
                  url: https://pingwin.mprlab.com/healthz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app-publish
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app-release
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 360
                increment: 0s
                initial: 1s
                maximum: 5s
                multiplier: 2
        private_inputs:
            operations: []
    owner: pinguin
    publications:
        ghcr:
            images:
                - artifact: pingwin-image
                  id: pingwin-image
                  repository: ghcr.io/tyemirov/pingwin
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: pingwin.mprlab.com
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: tyemirov/pinguin
        github_releases:
            binaries:
                - artifact: server
                  id: server
                  repository: tyemirov/pinguin
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: runtime
                  retired_services:
                    - project: mprlab-pinguin-runtime
                      service: pinguin-api
                  services:
                    - assets:
                        - mode: "0444"
                          source: configs/config.production.yml
                          target: /config/config.yml
                      endpoints:
                        - endpoint:
                            alias: pingwin-grpc
                            port: 50051
                            scheme: grpc
                            scope: same_host
                          health:
                            protocol: tcp
                          id: grpc
                          name: pingwin.grpc
                          version: 1
                        - endpoint:
                            port: 50052
                            scheme: grpc
                            scope: private_lan
                          health:
                            protocol: tcp
                          id: grpc-private-lan
                          name: pingwin.grpc.private-lan
                          version: 1
                        - endpoint:
                            alias: pingwin-api
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: http
                          name: pingwin.http
                          version: 1
                        - endpoint:
                            alias: pingwin-smtp-forwarding
                            port: 25
                            scheme: smtp
                            scope: same_host
                          health:
                            protocol: smtp
                          id: smtp-forwarding
                          name: pingwin.smtp-forwarding
                          version: 1
                        - endpoint:
                            alias: pingwin-smtp-submission
                            port: 587
                            scheme: smtp
                            scope: same_host
                          health:
                            protocol: smtp
                          id: smtp-submission
                          name: pingwin.smtp-submission
                          version: 1
                        - endpoint:
                            alias: runtime-pingwin-api-readiness
                            port: 8080
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /healthz
                            protocol: http
                          id: readiness
                          name: pingwin.readiness.runtime.pingwin-api
                          version: 1
                      environment:
                        - input: connection-timeout-sec
                          name: CONNECTION_TIMEOUT_SEC
                        - input: database-path
                          name: DATABASE_PATH
                        - input: http-allowed-origin1
                          name: HTTP_ALLOWED_ORIGIN1
                        - input: http-allowed-origin2
                          name: HTTP_ALLOWED_ORIGIN2
                        - input: http-allowed-origin3
                          name: HTTP_ALLOWED_ORIGIN3
                        - input: http-listen-addr
                          name: HTTP_LISTEN_ADDR
                        - input: log-level
                          name: LOG_LEVEL
                        - input: master-encryption-key
                          name: MASTER_ENCRYPTION_KEY
                        - input: max-retries
                          name: MAX_RETRIES
                        - input: operation-timeout-sec
                          name: OPERATION_TIMEOUT_SEC
                        - input: retry-interval-sec
                          name: RETRY_INTERVAL_SEC
                        - input: smtp-forwarding-enabled
                          name: SMTP_FORWARDING_ENABLED
                        - input: smtp-forwarding-hostname
                          name: SMTP_FORWARDING_HOSTNAME
                        - input: smtp-forwarding-listen-addr
                          name: SMTP_FORWARDING_LISTEN_ADDR
                        - input: smtp-forwarding-max-message-bytes
                          name: SMTP_FORWARDING_MAX_MESSAGE_BYTES
                        - input: smtp-forwarding-max-recipients
                          name: SMTP_FORWARDING_MAX_RECIPIENTS
                        - input: smtp-forwarding-relay-host
                          name: SMTP_FORWARDING_RELAY_HOST
                        - input: smtp-forwarding-relay-password
                          name: SMTP_FORWARDING_RELAY_PASSWORD
                        - input: smtp-forwarding-relay-port
                          name: SMTP_FORWARDING_RELAY_PORT
                        - input: smtp-forwarding-relay-username
                          name: SMTP_FORWARDING_RELAY_USERNAME
                        - input: smtp-submission-allow-insecure-auth
                          name: SMTP_SUBMISSION_ALLOW_INSECURE_AUTH
                        - input: smtp-submission-delivery-mode
                          name: SMTP_SUBMISSION_DELIVERY_MODE
                        - input: smtp-submission-hostname
                          name: SMTP_SUBMISSION_HOSTNAME
                        - input: smtp-submission-listen-addr
                          name: SMTP_SUBMISSION_LISTEN_ADDR
                        - input: smtp-submission-max-message-bytes
                          name: SMTP_SUBMISSION_MAX_MESSAGE_BYTES
                        - input: smtp-submission-max-recipients
                          name: SMTP_SUBMISSION_MAX_RECIPIENTS
                        - input: smtp-submission-public-port
                          name: SMTP_SUBMISSION_PUBLIC_PORT
                        - input: smtp-submission-public-security-mode
                          name: SMTP_SUBMISSION_PUBLIC_SECURITY_MODE
                        - input: smtp-submission-relay-host
                          name: SMTP_SUBMISSION_RELAY_HOST
                        - input: smtp-submission-relay-password
                          name: SMTP_SUBMISSION_RELAY_PASSWORD
                        - input: smtp-submission-relay-port
                          name: SMTP_SUBMISSION_RELAY_PORT
                        - input: smtp-submission-relay-username
                          name: SMTP_SUBMISSION_RELAY_USERNAME
                        - input: tauth-cookie-name
                          name: TAUTH_COOKIE_NAME
                        - input: tauth-signing-key
                          name: TAUTH_SIGNING_KEY
                      id: pingwin-api
                      image:
                        publication: pingwin-image
                      mounts:
                        - read_only: false
                          target: /app/data
                          volume: data
                      placement:
                        cardinality: one
                        group: gateway
                      ports:
                        - container_port: 25
                        - container_port: 50051
                          host_port: 50052
                          scope: private_lan
                        - container_port: 587
                        - container_port: 8080
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: mprlab-nginx-gateway_pinguin-data
                      retention: retain
        github_pages:
            sites:
                - id: website
                  publication: website
                  url: https://pingwin.mprlab.com/
        ingress:
            caddy:
                listeners:
                    - caddy:
                        capability: caddy.layer4.tcp
                        version: 1
                      hostname: mx.pingwin.mprlab.com
                      host_port: 8025
                      id: public-smtp-forwarding
                      operations:
                        - name: app-deploy
                          polling:
                            attempt_limit: 200
                            increment: 1s
                            initial: 1s
                            maximum: 10s
                            multiplier: 2
                          timeouts:
                            completion: 30m
                            readiness: 5m
                            request: 30s
                            shutdown: 30s
                            startup: 1m
                      port: 25
                      tls:
                        mode: disabled
                      transport: tcp
                      upstream: pingwin.smtp-forwarding
                    - caddy:
                        capability: caddy.layer4.tls
                        version: 1
                      hostname: pingwin-api.mprlab.com
                      host_port: 8465
                      id: public-smtp-submission
                      operations:
                        - name: app-deploy
                          polling:
                            attempt_limit: 200
                            increment: 1s
                            initial: 1s
                            maximum: 10s
                            multiplier: 2
                          timeouts:
                            completion: 30m
                            readiness: 5m
                            request: 30s
                            shutdown: 30s
                            startup: 1m
                      port: 465
                      tls:
                        mode: automatic
                      transport: tcp
                      upstream: pingwin.smtp-submission
                routes:
                    - access:
                        rate_limit:
                            events: 300
                            window_seconds: 10
                      handlers:
                        - id: default
                          path_prefix: /
                          transport:
                            dial_timeout_seconds: 10
                            protocol: http
                            read_timeout_seconds: 60
                            response_header_timeout_seconds: 60
                          upstream: pingwin.http
                      hostname: pingwin-api.mprlab.com
                      id: pingwin-public-api
                      operations:
                        - name: app-deploy
                          polling:
                            attempt_limit: 200
                            increment: 1s
                            initial: 1s
                            maximum: 10s
                            multiplier: 2
                          timeouts:
                            completion: 30m
                            readiness: 5m
                            request: 30s
                            shutdown: 30s
                            startup: 1m
                      listener: https
                      tls:
                        mode: automatic
