---
mprlab_resources:
  owner: pinguin
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        connection-timeout-sec: CONNECTION_TIMEOUT_SEC
        database-path: DATABASE_PATH
        http-allowed-origin1: HTTP_ALLOWED_ORIGIN1
        http-allowed-origin2: HTTP_ALLOWED_ORIGIN2
        http-allowed-origin3: HTTP_ALLOWED_ORIGIN3
        http-listen-addr: HTTP_LISTEN_ADDR
        log-level: LOG_LEVEL
        master-encryption-key: MASTER_ENCRYPTION_KEY
        max-retries: MAX_RETRIES
        operation-timeout-sec: OPERATION_TIMEOUT_SEC
        retry-interval-sec: RETRY_INTERVAL_SEC
        smtp-forwarding-enabled: SMTP_FORWARDING_ENABLED
        smtp-forwarding-hostname: SMTP_FORWARDING_HOSTNAME
        smtp-forwarding-listen-addr: SMTP_FORWARDING_LISTEN_ADDR
        smtp-forwarding-max-message-bytes: SMTP_FORWARDING_MAX_MESSAGE_BYTES
        smtp-forwarding-max-recipients: SMTP_FORWARDING_MAX_RECIPIENTS
        smtp-forwarding-relay-host: SMTP_FORWARDING_RELAY_HOST
        smtp-forwarding-relay-password: SMTP_FORWARDING_RELAY_PASSWORD
        smtp-forwarding-relay-port: SMTP_FORWARDING_RELAY_PORT
        smtp-forwarding-relay-username: SMTP_FORWARDING_RELAY_USERNAME
        smtp-submission-allow-insecure-auth: SMTP_SUBMISSION_ALLOW_INSECURE_AUTH
        smtp-submission-delivery-mode: SMTP_SUBMISSION_DELIVERY_MODE
        smtp-submission-hostname: SMTP_SUBMISSION_HOSTNAME
        smtp-submission-listen-addr: SMTP_SUBMISSION_LISTEN_ADDR
        smtp-submission-max-message-bytes: SMTP_SUBMISSION_MAX_MESSAGE_BYTES
        smtp-submission-max-recipients: SMTP_SUBMISSION_MAX_RECIPIENTS
        smtp-submission-public-port: SMTP_SUBMISSION_PUBLIC_PORT
        smtp-submission-public-security-mode: SMTP_SUBMISSION_PUBLIC_SECURITY_MODE
        smtp-submission-relay-host: SMTP_SUBMISSION_RELAY_HOST
        smtp-submission-relay-password: SMTP_SUBMISSION_RELAY_PASSWORD
        smtp-submission-relay-port: SMTP_SUBMISSION_RELAY_PORT
        smtp-submission-relay-username: SMTP_SUBMISSION_RELAY_USERNAME
        tauth-cookie-name: TAUTH_COOKIE_NAME
        tauth-google-web-client-id: TAUTH_TENANT_GOOGLE_WEB_CLIENT_ID_PINGUIN
        tauth-signing-key: TAUTH_SIGNING_KEY
    - kind: compose_project
      id: runtime
      retired_services:
        - project: mprlab-nginx-gateway
          service: pinguin-api
      images:
        - id: pinguin-image
          repository: ghcr.io/tyemirov/pinguin
          build:
            context: .
            dockerfile: Dockerfile
            platforms:
              - linux/amd64
              - linux/arm64
      services:
        - id: pinguin-api
          image: pinguin-image
          placement:
            group: gateway
            cardinality: one
          environment:
            CONNECTION_TIMEOUT_SEC:
              resource: private
              output: connection-timeout-sec
            DATABASE_PATH:
              resource: private
              output: database-path
            HTTP_ALLOWED_ORIGIN1:
              resource: private
              output: http-allowed-origin1
            HTTP_ALLOWED_ORIGIN2:
              resource: private
              output: http-allowed-origin2
            HTTP_ALLOWED_ORIGIN3:
              resource: private
              output: http-allowed-origin3
            HTTP_LISTEN_ADDR:
              resource: private
              output: http-listen-addr
            LOG_LEVEL:
              resource: private
              output: log-level
            MASTER_ENCRYPTION_KEY:
              resource: private
              output: master-encryption-key
            MAX_RETRIES:
              resource: private
              output: max-retries
            OPERATION_TIMEOUT_SEC:
              resource: private
              output: operation-timeout-sec
            RETRY_INTERVAL_SEC:
              resource: private
              output: retry-interval-sec
            SMTP_FORWARDING_ENABLED:
              resource: private
              output: smtp-forwarding-enabled
            SMTP_FORWARDING_HOSTNAME:
              resource: private
              output: smtp-forwarding-hostname
            SMTP_FORWARDING_LISTEN_ADDR:
              resource: private
              output: smtp-forwarding-listen-addr
            SMTP_FORWARDING_MAX_MESSAGE_BYTES:
              resource: private
              output: smtp-forwarding-max-message-bytes
            SMTP_FORWARDING_MAX_RECIPIENTS:
              resource: private
              output: smtp-forwarding-max-recipients
            SMTP_FORWARDING_RELAY_HOST:
              resource: private
              output: smtp-forwarding-relay-host
            SMTP_FORWARDING_RELAY_PASSWORD:
              resource: private
              output: smtp-forwarding-relay-password
            SMTP_FORWARDING_RELAY_PORT:
              resource: private
              output: smtp-forwarding-relay-port
            SMTP_FORWARDING_RELAY_USERNAME:
              resource: private
              output: smtp-forwarding-relay-username
            SMTP_SUBMISSION_ALLOW_INSECURE_AUTH:
              resource: private
              output: smtp-submission-allow-insecure-auth
            SMTP_SUBMISSION_DELIVERY_MODE:
              resource: private
              output: smtp-submission-delivery-mode
            SMTP_SUBMISSION_HOSTNAME:
              resource: private
              output: smtp-submission-hostname
            SMTP_SUBMISSION_LISTEN_ADDR:
              resource: private
              output: smtp-submission-listen-addr
            SMTP_SUBMISSION_MAX_MESSAGE_BYTES:
              resource: private
              output: smtp-submission-max-message-bytes
            SMTP_SUBMISSION_MAX_RECIPIENTS:
              resource: private
              output: smtp-submission-max-recipients
            SMTP_SUBMISSION_PUBLIC_PORT:
              resource: private
              output: smtp-submission-public-port
            SMTP_SUBMISSION_PUBLIC_SECURITY_MODE:
              resource: private
              output: smtp-submission-public-security-mode
            SMTP_SUBMISSION_RELAY_HOST:
              resource: private
              output: smtp-submission-relay-host
            SMTP_SUBMISSION_RELAY_PASSWORD:
              resource: private
              output: smtp-submission-relay-password
            SMTP_SUBMISSION_RELAY_PORT:
              resource: private
              output: smtp-submission-relay-port
            SMTP_SUBMISSION_RELAY_USERNAME:
              resource: private
              output: smtp-submission-relay-username
            TAUTH_COOKIE_NAME:
              resource: private
              output: tauth-cookie-name
            TAUTH_SIGNING_KEY:
              resource: private
              output: tauth-signing-key
          assets:
            - source: configs/config.production.yml
              target: /config/config.yml
              mode: "0444"
          mounts:
            - volume: data
              target: /app/data
              read_only: false
          ports:
            - container_port: 25
            - container_port: 587
            - container_port: 8080
            - container_port: 50051
          readiness:
            protocol: http
            port: 8080
            path: /healthz
            expected_status: 200
      volumes:
        - id: data
          name: mprlab-nginx-gateway_pinguin-data
          retention: retain
    - kind: runtime_capability
      id: http
      name: pinguin.http
      version: 1
      project: runtime
      service: pinguin-api
      endpoint:
        scope: same_host
        scheme: http
        alias: pinguin-api
        port: 8080
      health:
        protocol: http
        path: /healthz
        expected_status: 200
    - kind: runtime_capability
      id: grpc
      name: pinguin.grpc
      version: 1
      project: runtime
      service: pinguin-api
      endpoint:
        scope: same_host
        scheme: grpc
        alias: pinguin-grpc
        port: 50051
      health:
        protocol: tcp
    - kind: runtime_capability
      id: smtp-submission
      name: pinguin.smtp-submission
      version: 1
      project: runtime
      service: pinguin-api
      endpoint:
        scope: same_host
        scheme: smtp
        alias: pinguin-smtp-submission
        port: 587
      health:
        protocol: smtp
    - kind: runtime_capability
      id: smtp-forwarding
      name: pinguin.smtp-forwarding
      version: 1
      project: runtime
      service: pinguin-api
      endpoint:
        scope: same_host
        scheme: smtp
        alias: pinguin-smtp-forwarding
        port: 25
      health:
        protocol: smtp
    - kind: caddy_route
      id: public-api
      hostname: pinguin-api.mprlab.com
      listener: https
      handlers:
        - id: default
          path_prefix: /
          upstream: pinguin.http
          transport:
            protocol: http
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 60
            read_timeout_seconds: 60
      tls:
        mode: automatic
      access:
        rate_limit:
          events: 300
          window_seconds: 10
    - kind: caddy_listener
      id: public-smtp-submission
      port: 465
      transport: tcp
      hostname: pinguin-api.mprlab.com
      upstream: pinguin.smtp-submission
      tls:
        mode: automatic
      caddy:
        capability: caddy.layer4.tls
        version: 1
    - kind: caddy_listener
      id: public-smtp-forwarding
      port: 25
      transport: tcp
      hostname: mx.pinguin.mprlab.com
      upstream: pinguin.smtp-forwarding
      tls:
        mode: disabled
      caddy:
        capability: caddy.layer4.tcp
        version: 1
    - kind: health_check
      id: public-health
      protocol: http
      url: https://pinguin-api.mprlab.com/healthz
      expected_status: 200
    - kind: health_check
      id: website-health
      protocol: http
      url: https://pinguin.mprlab.com/healthz
      expected_status: 200
    - kind: github_pages
      id: website
      repository: tyemirov/pinguin
      branch: gh-pages
      domain: pinguin.mprlab.com
      url: https://pinguin.mprlab.com/
      source:
        kind: directory
        path: web
      verification:
        path: /.mprlab-release.json
    - kind: github_release_binary
      id: server
      repository: tyemirov/pinguin
      build:
        system: go
        package: ./cmd/server
        binary: pinguin
        platforms:
          - linux/amd64
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
    - kind: tauth_tenant
      id: authentication
      capability: tauth.tenants
      version: 1
      tenant:
        id: pinguin
        display_name: Pinguin
        origins:
          - https://pinguin.mprlab.com
        google_web_client_id:
          resource: private
          output: tauth-google-web-client-id
        jwt_signing_key:
          resource: private
          output: tauth-signing-key
        cookie:
          domain: .mprlab.com
          session_name: app_session_pinguin
          refresh_name: app_refresh_pinguin
