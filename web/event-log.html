<!doctype html>
<html lang="en" data-theme="dark" data-mpr-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pinguin Event Log</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.css"
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/event-log.css" />
    <script defer src="/js/google-analytics.js"></script>
    <script defer src="/js/runtime-config.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui-config.js"></script>
    <script
      id="mpr-ui-bundle"
      type="application/json"
      data-mpr-ui-bundle-src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@latest/mpr-ui.js"
    ></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="https://loopaware.mprlab.com/pixel.js?site_id=e8f235c8-ddf2-46b7-ae42-022885fe8a44"></script>
  </head>
  <body data-page="event-log" class="theme-dark" data-theme="dark" x-data="appShell()">
    <mpr-header
      id="pinguin-event-log-header"
      data-config-url="/config-ui.yaml"
      brand-label="Pinguin"
      brand-href="/"
      nav-links='[{ "label": "Docs", "href": "https://github.com/tyemirov/pinguin" }]'
    >
      <a slot="brand" class="pinguin-brand" href="/" aria-label="Pinguin home">
        <img class="pinguin-brand__mark" src="/favicon.svg" alt="" aria-hidden="true" />
        <span>Pinguin</span>
      </a>
      <span slot="nav-left" class="workspace-navigation__menu">
        <a
          class="workspace-navigation__link"
          :href="RUNTIME_CONFIG.eventLogUrl"
          aria-current="page"
          x-text="STRINGS.navigation.eventLog"
        ></a>
        <a
          class="workspace-navigation__link"
          :href="RUNTIME_CONFIG.smtpRelayUrl"
          x-text="STRINGS.navigation.smtpRelay"
        ></a>
      </span>
    </mpr-header>
    <main class="page-main">
      <section
        id="event-log"
        class="page-work-surface panel event-log-panel"
        aria-labelledby="event-log-title"
        x-data="notificationsList()"
        data-testid="page-work-surface"
      >
        <header class="panel-header">
          <div>
            <h1 id="event-log-title" class="section-title" x-text="strings.title"></h1>
            <p class="text-muted" x-text="strings.subtitle"></p>
          </div>
        </header>
        <section class="event-log-toolbar" aria-label="Event log controls">
          <label>
            <span x-text="strings.tenantLabel"></span>
            <select
              x-model="selectedTenantId"
              x-on:change="changeTenant()"
              :disabled="isLoadingTenants || tenants.length === 0"
            >
              <template x-for="tenant in tenants" :key="tenant.id">
                <option :value="tenant.id" x-text="tenant.displayName"></option>
              </template>
            </select>
          </label>
          <label>
            <span x-text="strings.searchLabel"></span>
            <input
              type="search"
              x-model="searchQuery"
              :placeholder="strings.searchPlaceholder"
              autocomplete="off"
            />
          </label>
          <fieldset class="status-filter">
            <legend x-text="strings.statusFilterLabel"></legend>
            <div class="status-filter__options">
              <template x-for="option in STATUS_OPTIONS" :key="option.value">
                <button
                  class="filter-chip"
                  type="button"
                  :aria-pressed="String(statusFilter === option.value)"
                  x-on:click="selectStatusFilter(option.value)"
                  x-text="option.label"
                ></button>
              </template>
            </div>
          </fieldset>
          <span class="loaded-count" data-testid="loaded-count" x-text="loadedCountLabel()"></span>
          <button
            class="button"
            type="button"
            x-on:click="loadNotifications()"
            x-text="actions.refresh"
          ></button>
        </section>
        <p
          class="notification-page-status"
          x-cloak
          x-show="isLoadingTenants"
          x-text="strings.tenantLoading"
        ></p>
        <template x-if="errorMessage">
          <p class="notice" data-variant="error" x-text="errorMessage"></p>
        </template>
        <notification-list role="list" data-testid="notifications-list">
          <template x-if="isLoading">
            <p class="empty-state notification-list-state" x-text="strings.loadingState"></p>
          </template>
          <template x-if="!isLoading && notifications.length === 0">
            <p class="empty-state notification-list-state" x-text="strings.emptyState"></p>
          </template>
          <template x-for="item in notifications" :key="item.id">
            <article class="notification-record" role="listitem" data-testid="notification-row">
              <div class="notification-record__primary">
                <h2 x-text="item.subject || strings.untitledLabel"></h2>
                <p class="notification-record__recipient" x-text="item.recipient"></p>
                <p class="notification-record__created">
                  <span x-text="strings.createdLabel"></span>
                  <time x-text="formatTimestamp(item.createdAt)"></time>
                </p>
              </div>
              <div class="notification-record__metadata">
                <span class="notification-record__metadata-item">
                  <span class="metadata-label" x-text="strings.tenantMetadataLabel"></span>
                  <span x-text="item.tenantId || '—'"></span>
                </span>
                <span class="status-badge" :data-variant="item.status" x-text="formatStatus(item.status)"></span>
                <span class="notification-record__metadata-item">
                  <span class="metadata-label" x-text="strings.scheduledLabel"></span>
                  <span x-text="formatTimestamp(item.scheduledFor)"></span>
                </span>
              </div>
              <template x-if="item.status === 'queued'">
                <div class="notification-record__actions">
                  <button
                    class="button"
                    type="button"
                    x-on:click="openScheduleDialog($event, item)"
                    x-text="actions.reschedule"
                  ></button>
                  <button
                    class="button danger"
                    type="button"
                    x-on:click="openCancelDialog($event, item)"
                    x-text="actions.cancel"
                  ></button>
                </div>
              </template>
            </article>
          </template>
        </notification-list>
        <div
          class="notification-scroll-sentinel"
          x-ref="scrollSentinel"
          data-testid="notification-scroll-sentinel"
          aria-hidden="true"
        ></div>
        <p
          class="notification-page-status"
          x-cloak
          x-show="isLoadingMore"
          x-text="strings.loadingMore"
        ></p>
        <p
          class="notification-page-status"
          x-cloak
          x-show="hasLoadedNotifications && notifications.length > 0 && !nextCursor && !isLoadingMore"
          x-text="strings.endOfResults"
        ></p>
        <dialog
          class="dialog"
          x-ref="scheduleDialog"
          aria-labelledby="schedule-dialog-title"
          x-on:close="handleDialogClosed()"
        >
          <form class="dialog__body" x-on:submit.prevent="submitSchedule">
            <header class="dialog__header">
              <h2 id="schedule-dialog-title" x-text="strings.scheduleDialogTitle"></h2>
              <p x-text="strings.scheduleDialogDescription"></p>
            </header>
            <label>
              <span x-text="strings.deliveryTimeLabel"></span>
              <input type="datetime-local" x-model="scheduleForm.scheduledTime" required />
            </label>
            <footer class="dialog__actions">
              <button class="button" type="button" x-on:click="closeScheduleDialog()" x-text="actions.close"></button>
              <button class="button primary" type="submit" x-text="actions.saveChanges"></button>
            </footer>
          </form>
        </dialog>
        <dialog
          class="dialog"
          x-ref="cancelDialog"
          aria-labelledby="cancel-dialog-title"
          x-on:close="handleDialogClosed()"
        >
          <form class="dialog__body" x-on:submit.prevent="confirmCancelNotification">
            <header class="dialog__header">
              <h2 id="cancel-dialog-title" x-text="strings.cancelDialogTitle"></h2>
              <p x-text="strings.cancelDialogDescription"></p>
            </header>
            <footer class="dialog__actions">
              <button class="button" type="button" x-on:click="closeCancelDialog()" x-text="strings.cancelKeepLabel"></button>
              <button class="button danger" type="submit" x-text="strings.cancelActionLabel"></button>
            </footer>
          </form>
        </dialog>
      </section>
    </main>
    <div class="toast-center" x-data="toastCenter()" x-init="init()" aria-live="polite">
      <template x-for="toast in toasts" :key="toast.id">
        <button
          type="button"
          class="toast"
          :data-variant="toast.variant"
          x-on:click="dismissToast(toast.id)"
          x-text="toast.message"
        ></button>
      </template>
    </div>
    <script type="module" src="/js/bootstrap.js"></script>
    <mpr-footer
      id="pinguin-event-log-footer"
      prefix-text="Pinguin Notification Service"
      privacy-link-label="Privacy &amp; Terms"
      privacy-modal-content="
        <h1>Privacy Policy — Pinguin</h1>
        <p>Pinguin stores the notification drafts you create, recipient details, and delivery metadata solely to run the scheduling workspace.</p>
        <p>Authentication happens through the shared sign-in shell; Pinguin receives HttpOnly session cookies and never stores your password.</p>
        <p>We do not sell or share notification content with third parties, and you may remove queued items from the workspace at any time.</p>
      "
      links-collection='{"style":"drop-up","text":"Built By Marco Polo Research Lab","links":[{"label":"LLM Proxy","url":"https://llm-proxy.mprlab.com/"},{"label":"TAuth","url":"https://tauth.mprlab.com/"},{"label":"Ledger","url":"https://github.com/tyemirov/ledger"},{"label":"ISSUES.md","url":"https://issues.mprlab.com/"},{"label":"Dictator","url":"https://github.com/tyemirov/dictator"},{"label":"Pinguin","url":"https://pinguin.mprlab.com/"},{"label":"LoopAware","url":"https://loopaware.mprlab.com/"}]}'
      theme-switcher="toggle"
      theme-config='{"attribute":"data-theme","targets":["body"],"modes":[{"value":"light","attributeValue":"light","classList":["theme-light"]},{"value":"dark","attributeValue":"dark","classList":["theme-dark"]}]}'
    ></mpr-footer>
  </body>
</html>
